<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5f0;
            margin: 0;
            padding: 20px;
        }
        form {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
        }
        label {
            font-size: 18px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <form action="{% url 'add_employee' %}" method="post">
        {% csrf_token %}
        <table>
            <tr>
                <td><label>Employee Name</label></td>
                <td><input type="text" name="employee_name"></td>
            </tr>
            <tr>
                <td><label>Department</label></td>
                <td><input type="text" name="employee_dept"></td>
            </tr>
            <tr>
                <td><label>Age</label></td>
                <td><input type="number" name="employee_age"></td>
            </tr>
            <tr>
                <td><label>Email</label></td>
                <td><input type="email" name="employee_email"></td>
            </tr>
            <tr>
                <td><label>Contact Number</label></td>
                <td><input type="text" name="contact_num"></td>
            </tr>
            <tr>
                <td colspan="2"><button type="submit">Submit</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
